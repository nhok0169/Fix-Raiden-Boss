<svg xmlns="http://www.w3.org/2000/svg" width="126" height="20" viewBox="0 0 252 40" role="img" aria-label="The Council: 35">
  <!-- Inline badge with the member count. Same 20px line-height budget as the
       plain mini: crest cap, short name, then the crimson count chip.
       The count is hand-maintained here, exactly as in the full-size badge.
       The chip is deliberately sized for THREE digits (999 measures 39.6 in a
       52.5-wide chip), so the roster can keep growing without reflowing this. -->
  <defs>
    <linearGradient id="mcPlum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#63204f"/>
      <stop offset="55%"  stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#2e0c30"/>
    </linearGradient>
    <linearGradient id="mcCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a0f14"/>
      <stop offset="100%" stop-color="#2b1220"/>
    </linearGradient>
    <linearGradient id="mcBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6b4423"/>
      <stop offset="35%"  stop-color="#d4af37"/>
      <stop offset="65%"  stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4423"/>
    </linearGradient>
    <linearGradient id="mcCount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dc2626"/>
      <stop offset="45%"  stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <path d="M 8 1.5 L 244 1.5 L 250.5 8 L 250.5 32 L 244 38.5 L 8 38.5 L 1.5 32 L 1.5 8 Z" fill="url(#mcPlum)"/>
  <path d="M 8 1.5 L 36 1.5 L 36 38.5 L 8 38.5 L 1.5 32 L 1.5 8 Z" fill="url(#mcCap)"/>
  <path d="M 198 1.5 L 244 1.5 L 250.5 8 L 250.5 32 L 244 38.5 L 198 38.5 Z" fill="url(#mcCount)"/>
  <path d="M 8 1.5 L 244 1.5 L 250.5 8 L 250.5 32 L 244 38.5 L 8 38.5 L 1.5 32 L 1.5 8 Z"
        fill="none" stroke="url(#mcBronze)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="36" y1="3" x2="36" y2="37" stroke="url(#mcBronze)" stroke-width="1.4"/>
  <line x1="198" y1="3" x2="198" y2="37" stroke="url(#mcBronze)" stroke-width="1.4"/>

  <path d="M 19 10 L 26.5 12.5 L 26.5 22 Q 26.5 27.5 19 31 Q 11.5 27.5 11.5 22 L 11.5 12.5 Z"
        fill="#1d1128" stroke="#e0b055" stroke-opacity="0.9" stroke-width="1.3"/>
  <path d="M 15 15.5 L 23 26.5 M 23 15.5 L 15 26.5" stroke="#f0c46a" stroke-width="1.7" stroke-linecap="round"/>

  <text x="117" y="27" text-anchor="middle" fill="#f5e6c8"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="700" letter-spacing="0.5" style="font-variant: small-caps">The Council</text>

  <text x="224" y="27" text-anchor="middle" fill="#fdeacd"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="19" font-weight="700" letter-spacing="0.5">35</text>
</svg>
